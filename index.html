<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Handy Bird</title>
  <style>
    :root { color-scheme: light; font-family: "Courier New", monospace; color: #383936; background: #f7f7f5; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; padding: 0 32px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid #383936; outline-offset: 5px; }
    main { max-width: 1180px; margin: 0 auto; }
    header { height: 116px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #deded9; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 28px; height: 28px; shape-rendering: crispEdges; }
    h1 { margin: 0; font-size: 18px; letter-spacing: -.8px; }
    .edition { color: #92938c; font-size: 11px; letter-spacing: 1px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 36px; margin-top: 46px; }
    .section-top { min-height: 30px; display: flex; justify-content: space-between; align-items: start; font-size: 11px; letter-spacing: 1px; }
    .muted { color: #90918a; }
    .scores { display: flex; gap: 20px; font-variant-numeric: tabular-nums; }
    .scores strong { font-weight: 400; color: #383936; }
    .canvas-wrap { position: relative; border: 1px solid #d8d9d2; background: #fdfdfb; }
    #game { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .game-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; }
    .hint { margin: 0; color: #85867f; font-size: 11px; line-height: 1.7; }
    kbd { font: inherit; color: #50514b; border-bottom: 1px solid #bfc0b8; }
    .reset { padding: 6px 0 6px 10px; border: 0; background: transparent; font-size: 11px; }
    .reset:hover { color: #000; }
    aside { border-left: 1px solid #deded9; padding-left: 28px; }
    .model-title { letter-spacing: 0; }
    .status-dot { display: inline-block; width: 6px; height: 6px; background: #b8b9b2; margin-right: 6px; }
    .status-dot.on { background: #383936; }
    #camera-preview { aspect-ratio: 1; width: 100%; overflow: hidden; display: grid; place-items: center; background: #edede8; border: 1px solid #d8d9d2; }
    #camera-preview canvas { width: 100%; height: auto; display: block; }
    .camera-placeholder { display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 10px; color: #96978f; }
    .camera-placeholder svg { width: 28px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    #camera-button { width: 100%; margin-top: 12px; min-height: 37px; border: 1px solid #383936; background: #383936; color: #fdfdfb; font-size: 11px; }
    #camera-button:hover { background: #53544e; }
    #camera-button:disabled { opacity: .55; cursor: wait; }
    .prediction-head { display: flex; justify-content: space-between; margin-top: 28px; margin-bottom: 18px; font-size: 10px; color: #90918a; }
    #active-class { color: #383936; }
    .class-row { margin-bottom: 17px; }
    .class-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 7px; color: #898a82; }
    .class-row.active .class-label { color: #383936; font-weight: bold; }
    .track { height: 4px; background: #e3e4dd; }
    .bar { height: 100%; width: 0; background: #b1b2a9; transition: width 100ms linear; }
    .class-row.active .bar { background: #383936; }
    #camera-message { margin: 22px 0 0; min-height: 30px; font-size: 10px; line-height: 1.6; color: #85867f; overflow-wrap: anywhere; }
    .site-footer { display: flex; justify-content: space-between; gap: 16px; margin: 38px 0 28px; padding-top: 18px; border-top: 1px solid #deded9; font-size: 10px; color: #98998f; }
    @media (min-width: 1400px) { main { padding-top: 38px; } }
    @media (max-width: 850px) { body { padding: 0 20px; } .layout { gap: 22px; grid-template-columns: minmax(0, 1fr) 210px; } aside { padding-left: 20px; } .edition { display: none; } }
    @media (max-width: 650px) { header { height: 86px; } .layout { grid-template-columns: 1fr; margin-top: 26px; } aside { border-left: 0; border-top: 1px solid #deded9; padding: 22px 0 0; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 0 22px; } aside > .section-top { grid-column: 1 / -1; } .camera-controls { grid-column: 1; } .model-readout { grid-column: 2; } .prediction-head { margin-top: 0; } #camera-message { margin-top: 14px; } .site-footer { margin-top: 26px; } .game-footer { gap: 8px; } }
    @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path fill="currentColor" d="M10 5h12v3h3v9h-3v5H7v-3H3V9h4v5h3z"/><path fill="#f7f7f5" d="M19 8h3v3h-3zM10 15h7v3h-7z"/></svg>
        <h1>handy bird</h1>

    </header>
    <div class="layout">
      <section aria-label="Little Bird game">
        <div class="section-top"><span id="game-status">READY WHEN YOU ARE</span><div class="scores"><span class="muted">PASS <strong id="score">000</strong></span></div></div>
        <div class="canvas-wrap"><canvas id="game" width="720" height="440" aria-label="Gesture-controlled flying game. Show Fly to move forward and rise; Default to stop and land."></canvas></div>
        <div class="game-footer"><p class="hint"><kbd>Fly</kbd> to move · <kbd>Default</kbd> to rest</p><button class="reset" id="reset-button" type="button" aria-label="Reset map">↻ reset</button></div>
      </section>
      <aside aria-label="Teachable Machine camera and predictions">
        <div class="section-top"><span class="model-title">Teachable Machine</span><span class="muted"><span class="status-dot" id="camera-dot"></span><span id="camera-state">OFF</span></span></div>
        <div class="camera-controls">
          <div id="camera-preview"><div class="camera-placeholder"><svg viewBox="0 0 28 24" aria-hidden="true"><path d="M2 6h6l2-3h8l2 3h6v16H2z"/><circle cx="14" cy="13" r="5"/></svg><span>CAMERA OFF</span></div></div>
          <button id="camera-button" type="button">Enable camera ↗</button>
        </div>
        <div class="model-readout">
          <div class="prediction-head"><span>TRIGGER</span><span id="active-class" role="status">—</span></div>
          <div class="class-row" id="row-fly"><div class="class-label"><span>Fly</span><span id="value-fly">—</span></div><div class="track" role="progressbar" aria-label="Fly confidence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track-fly"><div class="bar" id="bar-fly"></div></div></div>
          <div class="class-row" id="row-default"><div class="class-label"><span>Default</span><span id="value-default">—</span></div><div class="track" role="progressbar" aria-label="Default confidence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track-default"><div class="bar" id="bar-default"></div></div></div>
          <p id="camera-message" role="status">Fly = move + lift. Default = rest.</p>
        </div>
      </aside>
    </div>
    <footer class="site-footer"><span>NO RUSH. NO GAME OVER.</span><span>WINGBEAT → LIFT → GLIDE</span></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const $ = id => document.getElementById(id);
    const W = canvas.width, H = canvas.height, FLOOR = 400;
    const SPEED = 115, GRAVITY = 650, LIFT = -310, FLAP_MS = 300;
    const bird = { x: 144, y: FLOOR - 12, vy: 0, r: 12, grounded: true };
    let pipes = [], cameraX = 0, score = 0, started = false;
    let lastFrame = 0, accumulator = 0, lastFlap = -Infinity, lastInput = false;
    let modelActive = false, lastPredictionAt = -Infinity;
    let flyUntil = -Infinity, smoothedFly = null;
    let model = null, webcam = null, cameraRunning = false, cameraBusy = false, cameraSession = 0;
    let runTime = 0;

    function addPipe(x) {
      const previous = pipes[pipes.length - 1];
      const center = previous ? Math.max(155, Math.min(258, previous.center + (Math.random() - .5) * 100)) : 240;
      pipes.push({ x, center, gap: 192, w: 48, passed: false });
    }
    function resetGame() {
      bird.x = 144; bird.y = FLOOR - bird.r; bird.vy = 0; bird.grounded = true;
      pipes = []; cameraX = 0; score = 0; started = false;
      lastFlap = -Infinity; lastInput = false;
      $('score').textContent = '000';
      addPipe(510); addPipe(820); addPipe(1130);
    }
    function modelFlying(now) { return modelActive && now - lastPredictionAt < 600 && now < flyUntil; }
    function flap() { bird.vy = LIFT; bird.grounded = false; lastFlap = runTime; started = true; }
    function update(dt, now) {
      runTime += dt * 1000;
      const input = modelFlying(now);
      if (input && (!lastInput || runTime - lastFlap >= FLAP_MS)) flap();
      lastInput = input;
      const oldY = bird.y;
      bird.vy = Math.min(bird.vy + GRAVITY * dt, 360);
      let newY = bird.y + bird.vy * dt;
      bird.grounded = false;
      // Resolve vertical motion against solid pipe tops and undersides.
      for (const p of pipes) {
        if (bird.x + bird.r <= p.x || bird.x - bird.r >= p.x + p.w) continue;
        const top = p.center - p.gap / 2, bottom = p.center + p.gap / 2;
        if (bird.vy < 0 && oldY - bird.r >= top - .1 && newY - bird.r < top) { newY = top + bird.r; bird.vy = 0; }
        if (bird.vy >= 0 && oldY + bird.r <= bottom + .1 && newY + bird.r >= bottom) { newY = bottom - bird.r; bird.vy = 0; bird.grounded = true; }
      }
      if (newY >= FLOOR - bird.r) { newY = FLOOR - bird.r; bird.vy = 0; bird.grounded = true; }
      if (newY < bird.r) { newY = bird.r; bird.vy = Math.max(0, bird.vy); }
      bird.y = newY;
      // Only a recognized Fly gesture advances the bird in the stationary world.
      let travel = input && !bird.grounded ? SPEED * dt : 0;
      for (const p of pipes) {
        const inGap = bird.y - bird.r >= p.center - p.gap / 2 && bird.y + bird.r <= p.center + p.gap / 2;
        if (!inGap && p.x >= bird.x + bird.r - .01) travel = Math.min(travel, Math.max(0, p.x - bird.x - bird.r));
      }
      bird.x += travel;
      // Follow the bird only after it reaches the forward edge of the camera dead zone.
      cameraX = Math.max(0, bird.x - W * .38);
      for (const p of pipes) {
        if (!p.passed && p.x + p.w < bird.x - bird.r) { p.passed = true; score++; $('score').textContent = String(score).padStart(3, '0'); }
      }
      pipes = pipes.filter(p => p.x + p.w > cameraX - 20);
      if (pipes[pipes.length - 1].x < cameraX + W + 30) addPipe(pipes[pipes.length - 1].x + 310);
      const blocked = input && !bird.grounded && travel < SPEED * dt * .5;
      const status = !started ? 'READY WHEN YOU ARE' : bird.grounded ? 'TAKE YOUR TIME' : blocked ? 'A LITTLE HIGHER' : input ? 'WINGS UP' : 'GLIDING';
      if ($('game-status').textContent !== status) $('game-status').textContent = status;
    }
    function rect(x, y, w, h, color = '#53564e') { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
    function cloud(x, y) {
      const c = '#d8dad1'; rect(x + 12, y, 20, 2, c); rect(x + 10, y + 2, 2, 9, c); rect(x + 32, y + 2, 2, 5, c); rect(x + 34, y + 6, 14, 2, c); rect(x + 48, y + 8, 2, 5, c); rect(x, y + 10, 10, 2, c); rect(x, y + 13, 50, 2, c);
    }
    function pipeSegment(x, y, h, isBottom) {
      if (h <= 0) return;
      x = Math.round(x); y = Math.round(y); h = Math.round(h);
      rect(x, y, 48, h); rect(x + 2, y, 44, h, '#f1f2ec');
      rect(x + 7, y, 2, h, '#d0d3c8'); rect(x + 39, y, 4, h, '#e0e2d9');
      const lipY = isBottom ? y : y + h - 12;
      rect(x, lipY, 48, 12); rect(x + 2, lipY + 2, 44, 8, '#e5e7de');
    }
    function drawBird(now) {
      const x = Math.round(bird.x - cameraX - 16), y = Math.round(bird.y - 12);
      const wingUp = !bird.grounded && runTime - lastFlap < 150;
      const sprite = ['      #######   ', '    ##########  ', '   ########.##  ', '##############  ', '############### ', ' ###############', '  ############  ', '   ##########   ', '     ######     '];
      sprite.forEach((row, iy) => [...row].forEach((v, ix) => { if (v === '#') rect(x + ix * 2, y + iy * 2, 2, 2, '#45483f'); else if (v === '.') rect(x + ix * 2, y + iy * 2, 2, 2, '#fdfdfb'); }));
      rect(x + 7, y + (wingUp ? 2 : 10), 10, 4, '#fdfdfb');
      rect(x + 5, y + (wingUp ? 0 : 8), 4, 4, '#45483f');
      if (bird.grounded) { rect(x + 12, y + 18, 2, 6); rect(x + 22, y + 18, 2, 6); rect(x + 12, y + 23, 6, 2); rect(x + 22, y + 23, 6, 2); }
    }
    function draw(now) {
      ctx.imageSmoothingEnabled = false; rect(0, 0, W, H, '#fdfdfb');
      for (const c of [{ x: 90, y: 78 }, { x: 360, y: 133 }, { x: 640, y: 62 }]) cloud(((c.x - cameraX * .18) % 840 + 840) % 840 - 60, c.y);
      for (const p of pipes) { pipeSegment(p.x - cameraX, 0, p.center - p.gap / 2, false); pipeSegment(p.x - cameraX, p.center + p.gap / 2, FLOOR - p.center - p.gap / 2, true); }
      rect(0, FLOOR, W, 1, '#787b70');
      for (let i = 0; i < 35; i++) { const x = ((i * 47 + (i % 3) * 13 - cameraX) % 770 + 770) % 770; rect(x, FLOOR + 7 + (i % 4) * 6, i % 2 ? 5 : 10, 1, '#c4c7bb'); }
      drawBird(now);
      if (!started) { ctx.fillStyle = '#a1a399'; ctx.font = '11px "Courier New", monospace'; ctx.textAlign = 'center'; ctx.fillText('a little lift goes a long way', W / 2, 205); ctx.textAlign = 'left'; }
    }
    function animate(now) {
      if (!document.hidden) {
        accumulator += Math.min((now - (lastFrame || now)) / 1000, .05);
        while (accumulator >= 1 / 120) { update(1 / 120, now); accumulator -= 1 / 120; }
        draw(now);
      }
      lastFrame = now; requestAnimationFrame(animate);
    }
    function clearInput() { lastInput = false; flyUntil = -Infinity; lastPredictionAt = -Infinity; }
    window.addEventListener('blur', clearInput);
    document.addEventListener('visibilitychange', () => { clearInput(); lastFrame = 0; accumulator = 0; });
    $('reset-button').addEventListener('click', resetGame);

    function handlePrediction(predictions, now) {
      if (!predictions.length) return;
      const fly = predictions.find(p => p.className.trim().toLowerCase() === 'fly');
      const probability = fly ? fly.probability : 0;
      smoothedFly = smoothedFly === null ? probability : smoothedFly * .3 + probability * .7;
      lastPredictionAt = now;
      // Lower entry threshold, hysteresis, and a short grace period absorb recognition jitter.
      if (smoothedFly >= (modelFlying(now) ? .42 : .62)) flyUntil = now + 220;
      const active = modelFlying(now);
      $('active-class').textContent = active ? 'Fly ↑' : 'Default';
      for (const name of ['fly', 'default']) {
        const p = predictions.find(item => item.className.trim().toLowerCase() === name);
        const value = Math.round((p ? p.probability : 0) * 100);
        $('value-' + name).textContent = value + '%'; $('bar-' + name).style.width = value + '%';
        $('track-' + name).setAttribute('aria-valuenow', value);
        $('row-' + name).classList.toggle('active', name === (active ? 'fly' : 'default'));
      }
    }
    function stopCamera(message = 'Fly = move + lift. Default = rest.') {
      cameraSession++; cameraRunning = false; modelActive = false; clearInput(); smoothedFly = null;
      if (webcam) { webcam.stop(); webcam = null; }
      $('camera-preview').innerHTML = '<div class="camera-placeholder"><span>CAMERA OFF</span></div>';
      $('camera-dot').classList.remove('on'); $('camera-state').textContent = 'OFF';
      $('camera-button').textContent = 'Enable camera ↗'; $('active-class').textContent = '—';
      for (const name of ['fly', 'default']) { $('value-' + name).textContent = '—'; $('bar-' + name).style.width = '0%'; $('track-' + name).setAttribute('aria-valuenow', '0'); $('row-' + name).classList.remove('active'); }
      $('camera-message').textContent = message;
    }
    async function predictLoop(session) {
      while (cameraRunning && session === cameraSession) {
        try {
          if (!document.hidden) {
            const currentWebcam = webcam;
            currentWebcam.update();
            const predictions = await model.predict(currentWebcam.canvas);
            if (session !== cameraSession) return;
            handlePrediction(predictions, performance.now());
          }
        } catch (error) { if (session === cameraSession) stopCamera('Recognition paused. Enable camera to retry.'); return; }
        await new Promise(resolve => setTimeout(resolve, 70));
      }
    }
    async function startCamera() {
      if (cameraBusy) return;
      cameraBusy = true; $('camera-button').disabled = true; $('camera-button').textContent = 'Connecting…';
      $('camera-message').textContent = 'Allow camera access to use Fly.';
      try {
        if (!window.isSecureContext || !navigator.mediaDevices) throw new Error('Use localhost or HTTPS for camera access.');
        if (!window.tmImage) throw new Error('Model library unavailable. Check your connection and retry.');
        if (!model) model = await tmImage.load('./tm-my-image-model/model.json', './tm-my-image-model/metadata.json');
        webcam = new tmImage.Webcam(224, 224, true);
        await webcam.setup(); await webcam.play(); webcam.update();
        $('camera-preview').replaceChildren(webcam.canvas);
        cameraRunning = true; modelActive = true; smoothedFly = null;
        $('camera-dot').classList.add('on'); $('camera-state').textContent = 'LIVE';
        $('camera-button').textContent = 'Turn off camera'; $('camera-message').textContent = 'Fly = move + lift. Default = rest.';
        predictLoop(++cameraSession);
      } catch (error) {
        const message = error.name === 'NotAllowedError' ? 'Camera blocked. Allow access, then retry.' : error.name === 'NotFoundError' ? 'No camera found. Connect a camera and retry.' : error.name === 'NotReadableError' ? 'Camera busy. Close other camera apps and retry.' : error.message;
        stopCamera(message);
      } finally { cameraBusy = false; $('camera-button').disabled = false; }
    }
    $('camera-button').addEventListener('click', () => cameraRunning ? stopCamera() : startCamera());
    window.addEventListener('pagehide', () => { if (webcam) stopCamera(); });
    resetGame(); requestAnimationFrame(animate);
  </script>
</body>
</html>
